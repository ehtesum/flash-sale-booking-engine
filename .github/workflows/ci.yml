name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test-and-lint:
    name: Code Quality & Full-Stack Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt fakeredis lupa aiosqlite pytest

      - name: Start API Gateway in Background
        run: |
          python -m uvicorn api.main:app --port 8000 &
          sleep 3

      - name: Run Full-Stack Smoke Test
        run: |
          python tests/smoke_test.py

      - name: Run 1,000-User Concurrency Benchmark
        run: |
          python benchmark/stress_test.py

