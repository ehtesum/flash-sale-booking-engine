apiVersion: v1
kind: ConfigMap
metadata:
  name: flash-sale-config
  namespace: flash-sale
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_PORT: "8000"
  MESSAGE_BROKER: "rabbitmq"
  REDIS_URL: "redis://redis-service.flash-sale.svc.cluster.local:6379/0"
  RABBITMQ_URL: "amqp://flashsale_guest:flashsale_guest@rabbitmq-service.flash-sale.svc.cluster.local:5672/"
  RATE_LIMIT_REQUESTS: "5"
  RATE_LIMIT_WINDOW_SECONDS: "10"
  RABBITMQ_PREFETCH_COUNT: "10"
  RABBITMQ_MAX_RETRIES: "3"
  RABBITMQ_RETRY_DELAY_MS: "2000"

