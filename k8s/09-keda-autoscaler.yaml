apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: flashsale-worker-autoscaler
  namespace: flash-sale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flashsale-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 5
  triggers:
    - type: rabbitmq
      metadata:
        queueName: orders.reserved
        mode: QueueLength
        value: "20"
      authenticationRef:
        name: keda-rabbitmq-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-rabbitmq-trigger-auth
  namespace: flash-sale
spec:
  secretTargetRef:
    - parameter: host
      name: flash-sale-secrets
      key: RABBITMQ_URL

