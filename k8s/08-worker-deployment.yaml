apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashsale-worker
  namespace: flash-sale
  labels:
    app: flashsale-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flashsale-worker
  template:
    metadata:
      labels:
        app: flashsale-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: flashsale-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: flash-sale-config
            - secretRef:
                name: flash-sale-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi

