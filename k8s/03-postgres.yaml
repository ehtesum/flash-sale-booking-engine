apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: flash-sale
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "flashsale_db"
            - name: POSTGRES_USER
              value: "flashsale_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flash-sale-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: flash-sale
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres

