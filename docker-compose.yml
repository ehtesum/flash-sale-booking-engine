version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flashsale_postgres
    environment:
      POSTGRES_DB: flashsale_db
      POSTGRES_USER: flashsale_user
      POSTGRES_PASSWORD: flashsale_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale_user -d flashsale_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flashsale_net

  redis:
    image: redis:7-alpine
    container_name: flashsale_redis
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flashsale_net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flashsale_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashsale_net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: flashsale_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flashsale_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: flashsale_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flashsale_net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: flashsale_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      API_PORT: 8000
      JWT_SECRET: flashsale-super-secret-key-change-in-prod-2026
      JWT_ALGORITHM: HS256
      MESSAGE_BROKER: rabbitmq
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RESERVED: orders.reserved
      KAFKA_TOPIC_DLQ: orders.dlq
      DATABASE_URL: postgresql+asyncpg://flashsale_user:flashsale_secure_password_2026@postgres:5432/flashsale_db
    networks:
      - flashsale_net

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: flashsale_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      MESSAGE_BROKER: rabbitmq
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_RESERVED: orders.reserved
      KAFKA_TOPIC_DLQ: orders.dlq
      KAFKA_CONSUMER_GROUP: flashsale-order-workers
      DATABASE_URL: postgresql+asyncpg://flashsale_user:flashsale_secure_password_2026@postgres:5432/flashsale_db
    networks:
      - flashsale_net

networks:
  flashsale_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

